manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      # XIAO nRF52840 を xiao_ble//zmk として扱う新しいボード命名（Zephyr 4.1 / hwmv2）と
      # ZMK Studio が必要なため main を追従する。
      # 安定版タグ v0.3 は旧命名（seeeduino_xiao_ble）で、この構成では使えない。
      #
      # ★ 一度ビルドが通って実機の動作確認ができたら、その時点の ZMK の
      #   コミット SHA にここを固定するのを推奨（例: revision: abc1234...）。
      #   main のままだと ZMK 側の変更でビルドが突然壊れることがある。
      revision: main
      import: app/west.yml
    # LED ステータス表示（zmk-rgbled-widget）
    # XIAO オンボードの RGB LED で、電池残量と BLE 接続状態を色で示す。
    # ★ ZMK 本体とバージョンを合わせる必要がある。ZMK が main を追従して
    #   いる間はここも main。ZMK をコミット SHA で固定するときは、
    #   このモジュールも同時に固定すること（ビルドが壊れる原因になる）。
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main

  self:
    path: config
