# xileft pad v2 iPad 版 ― ビルド設定
# v1 iPad 版と同じ内容。v2 は電池残量レポートが標準で機能する。

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- マウス（意図的に無効）---
# CONFIG_ZMK_POINTING=y

# --- LED ステータス表示（zmk-rgbled-widget）---
# 設定の意味と調整方法は config/xileft_pad.conf の同じ節を参照。
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=8000
CONFIG_RGBLED_WIDGET_INTERVAL_MS=500
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=1000

# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# CONFIG_ZMK_USB_LOGGING=y
