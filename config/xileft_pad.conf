# xileft pad ― ビルド設定
#
# キーマップは config/xileft_pad.keymap を編集する。
# 配線・エンコーダのピン定義は boards/shields/xileft_pad/xileft_pad.overlay。

# --- ロータリーエンコーダ（EC11 x3）---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- マウスボタン / ホイール（&mkp, &msc）---
# BASE レイヤの &lt_mkp 1 MB2 とエンコーダ2のスクロールに必要
CONFIG_ZMK_POINTING=y

# --- 電源インジケータ LED（XIAO オンボード緑 LED）---
# overlay の EXT_POWER ノードとセット。起動で点灯、BT レイヤから消灯できる。
CONFIG_ZMK_EXT_POWER=y

# --- 電池 ---
# リワークで ROT3 を P0.31 から P0.19 (D12) へ移設したため、
# 電池残量レポートは有効（BLE 有効時に自動で ON になる）。追加設定は不要。

# --- 省電力（必要になったら有効化）---
# 有効にするとアイドル後にディープスリープへ入り、電池が長持ちする。
# エンコーダからの復帰が不安定な場合はコメントアウトに戻すこと。
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- デバッグ用（不具合が出たときだけ有効化）---
# CONFIG_ZMK_USB_LOGGING=y
