# xileft pad ― ビルド設定
#
# キーマップは config/xileft_pad.keymap を編集する。
# 配線・エンコーダのピン定義は boards/shields/xileft_pad/xileft_pad.overlay。

# --- ロータリーエンコーダ（EC11 x3）---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- マウスボタン / ホイール（&mkp, &msc）---
# BASE レイヤの &lt_mkp 1 MB2 とエンコーダ2のスクロールに必要
CONFIG_ZMK_POINTING=y

# --- LED ステータス表示（zmk-rgbled-widget）---
# XIAO オンボードの RGB LED で状態を色で示す。GPIO の ON/OFF 駆動なので
# 輝度調整はできない（モジュールが gpio-leds を要求するため PWM 化も不可）。
# 実質の調整つまみは「光る時間」だけ。
#
#   起動時       : 電池レベル色を BATTERY_BLINK_MS -> 間を INTERVAL_MS ->
#                  接続状態色を CONN_BLINK_MS。合計 8 + 0.5 + 1 = 約 9.5 秒。
#                  これが「電源が入った」の合図を兼ねる。
#   BT切替時     : 接続状態色を CONN_BLINK_MS だけ点灯（自動）
#   残量表示キー : 電池レベル色を BATTERY_BLINK_MS だけ点灯（&ind_bat）
#
# ★ BATTERY_BLINK_MS は「起動時」と「残量表示キー」で共通、
#   CONN_BLINK_MS は「起動時」と「BT切替時」で共通。個別には設定できない。
#   起動を短くしたいなら BATTERY_BLINK_MS を下げる（キー押下時も短くなる）。
#
# 色: 電池 緑=80%以上 / 黄=20-80% / 赤=20%未満、5% 未満は赤で定期点滅。
#     接続 青=接続済 / 黄=ペアリング待ち / 赤=未接続。
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=8000
CONFIG_RGBLED_WIDGET_INTERVAL_MS=500
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=1000

# --- 電池 ---
# リワークで ROT3 を P0.31 から P0.19 (D12) へ移設したため、
# 電池残量レポートは有効（BLE 有効時に自動で ON になる）。追加設定は不要。

# --- 省電力（必要になったら有効化）---
# 有効にするとアイドル後にディープスリープへ入り、電池が長持ちする。
# エンコーダからの復帰が不安定な場合はコメントアウトに戻すこと。
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- デバッグ用（不具合が出たときだけ有効化）---
# CONFIG_ZMK_USB_LOGGING=y
