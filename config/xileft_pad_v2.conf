# xileft pad v2 ― ビルド設定
#
# v1 との違い:
#   - 電池残量レポートが有効（P0.31 を基板側で空けたため）。BLE で残量が見える。
#   - それ以外は v1 と同じ。

# --- ロータリーエンコーダ（EC11 x3）---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- マウスボタン / ホイール（&mkp, &msc）---
CONFIG_ZMK_POINTING=y

# --- 電源インジケータ LED（XIAO オンボード緑 LED）---
CONFIG_ZMK_EXT_POWER=y

# --- 省電力（必要になったら有効化）---
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- デバッグ用 ---
# CONFIG_ZMK_USB_LOGGING=y
