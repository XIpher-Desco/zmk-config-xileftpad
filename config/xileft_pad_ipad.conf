# xileft pad iPad 版 ― ビルド設定
#
# 通常版 (xileft_pad.conf) との唯一の違いは CONFIG_ZMK_POINTING を
# 有効化していないこと。マウスボタンもホイールも HID に出さない
# 「キーボードだけ」のデバイスになる。
#
# ★ POINTING の有無で HID レポートディスクリプタが変わるため、
#   通常版と iPad 版を同じ BT プロファイルで行き来すると、
#   ホスト側のキャッシュが食い違って誤動作する。
#   別のプロファイル番号を割り当てて運用すること。

# --- ロータリーエンコーダ（EC11 x3）---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- マウス（意図的に無効）---
# CONFIG_ZMK_POINTING=y

# --- 電源インジケータ LED（XIAO オンボード緑 LED）---
CONFIG_ZMK_EXT_POWER=y

# --- 省電力（必要になったら有効化）---
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- デバッグ用 ---
# CONFIG_ZMK_USB_LOGGING=y
